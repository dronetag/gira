[build-system]
requires = ["setuptools >= 68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gira"
requires-python = ">=3.11"
description = "GIRA places JIRA tickets from your dependencies into your commit message"
license.text = "MIT"
authors = [
  {name = "Tomas Peterka", email = "tomas.peterka@dronetag.cz"},
  {name = "Tomas Benes", email = "tomas@dronetag.cz"},
]
dynamic = ["version"]
readme = "README.md"
# beware before upgrading to 1.20.0 - it removed GIT_REPOSITORY_OPEN_BARE
# see https://github.com/libgit2/pygit2/blob/master/CHANGELOG.md#1200-2026-08-08
dependencies = [
  "pygit2 >=1.19.0, <1.20.0",
  "pyyaml",
  "jira",
  "packaging",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "gira.__version__.version"}

[project.scripts]
gira = "gira.__main__:main"

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "wheel",
  "build",
  "pytest",
  "pre-commit",
  "types-PyYAML",
]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["F", "E", "I"]  # F: pyflakes, E: pycodestyle, I: isort
ignore = []
exclude = ["tests/*"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
